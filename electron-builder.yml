appId: dev.sutra.ide
productName: Sutra
copyright: Sutra
asar: false
directories:
  output: release
  buildResources: desktop/icons
files:
  - desktop/**
  - package.json
  - vite.config.ts
  - tsconfig.json
  - scripts/**
  - src/**
  - public/**
  - server/**
  - docs/**
  - .vercel/output/**
  - node_modules/**
  - "!node_modules/.cache/**"
  - "!**/*.map"
extraMetadata:
  main: desktop/main.mjs
win:
  target:
    - nsis
    - portable
  artifactName: Sutra-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Sutra
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: Sutra-${version}-mac.${ext}
linux:
  target:
    - AppImage
  artifactName: Sutra-${version}.AppImage
