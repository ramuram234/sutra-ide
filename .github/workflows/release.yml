name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i
        working-directory: extensions/vscode
      - run: npx tsc -p .
        working-directory: extensions/vscode
      - run: npm i -g @vscode/vsce
      - run: vsce package --allow-missing-repository --skip-license
        working-directory: extensions/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: extensions/vscode/*.vsix

  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle buildPlugin
        working-directory: extensions/intellij
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: extensions/intellij/build/distributions/*
